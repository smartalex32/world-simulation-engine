services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: world_simulation
      POSTGRES_USER: world_simulation
      POSTGRES_PASSWORD: change-me-before-deployment
    volumes:
      - world-simulation-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U world_simulation -d world_simulation"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

volumes:
  world-simulation-postgres:
