# Primary Codex model.
#
# Normal development sessions should use Terra Medium.
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

# Keep planning at Medium by default as well.
# Increase manually when a particularly difficult design problem warrants it.
plan_mode_reasoning_effort = "medium"


# ---------------------------------------------------------------------------
# Subagents
# ---------------------------------------------------------------------------

[agents]

# Enable multi-agent support.
enabled = true

# Limit parallel subagents to prevent unnecessary usage.
#
# Three allows useful parallelism without encouraging large agent swarms.
max_concurrent_threads_per_session = 3

# Cost safety net:
#
# If the primary agent spawns a generic subagent without explicitly choosing
# one of the configured roles, default that agent to Luna Low.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "low"

# Preserve interruption context for agents.
interrupt_message = true